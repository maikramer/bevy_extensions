name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The crates without internal version-deps can be verified fully.
      - run: cargo publish --dry-run --locked -p bevy_ext_core
      - run: cargo publish --dry-run --locked -p bevy_ext_grass
      - run: cargo publish --dry-run --locked -p bevy_ext_world
      - run: cargo publish --dry-run --locked -p bevy_ext_gltf
      - run: cargo publish --dry-run --locked -p bevy_voxel_terrain
      # These depend on the crates above; validate the package contents until
      # the dependencies are on the crates.io index.
      - run: cargo package --list -p bevy_ext_terrain
      - run: cargo package --list -p bevy_ext_save
