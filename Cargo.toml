[workspace]
# Pacotes da release 0.1.0. O plugin `bevy_voxel_terrain_jackdaw` é WIP
# concorrente (API do Jackdaw ainda a fechar) e fica fora do workspace até
# compilar; os ficheiros ficam preservados no repo.
members = [
    "crates/bevy_ext_core",
    "crates/bevy_ext_terrain_runtime",
    "crates/bevy_ext_elements",
    "crates/bevy_ext_flora",
    "crates/bevy_ext_gradmesh",
    "crates/bevy_ext_scene",
    "crates/bevy_ext_postfx",
    "crates/bevy_ext_luau",
    "crates/bevy_ext_nav",
    "crates/bevy_ext_gltf",
    "crates/bevy_ext_save",
    "crates/bevy_ext_terrain",
    "crates/bevy_ext_ui",
    "crates/bevy_ext_world",
    "crates/bevy_voxel_terrain",
    "crates/bevy_ext_audio",
    "crates/bevy_ext_ai",
    "crates/bevy_ext_water",
    "crates/bevy_ext_grass",
    "crates/bevy_ext_physics",
    "crates/bevy_ext_engine",
]
# Standalone (fora do workspace): o plugin Jackdaw WIP e o scene_runtime.
# O monólito (`bevy_ext_viber_engine`) continua fora: tem CelerAI por path,
# vendor/rerecast próprio e um mlua vendored — mas agora DEPENDE dos members
# (`bevy_ext_physics`/`bevy_ext_engine`, que já não o dep).
exclude = [
    "crates/bevy_voxel_terrain_jackdaw",
    "crates/bevy_ext_scene_runtime",
    "crates/bevy_ext_viber_engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/bevy_extensions"
authors = ["Maikeu Locatelli"]

[workspace.dependencies]
# Base sem features; cada crate liga o que precisa.
bevy = { version = "0.20.1", default-features = false }

# Família lockstep + path local (o path é removido no `.crate` publicado).
bevy_ext_core = { version = "0.1.0", path = "crates/bevy_ext_core" }
bevy_ext_luau = { version = "0.1.0", path = "crates/bevy_ext_luau" }
bevy_ext_gltf = { version = "0.1.0", path = "crates/bevy_ext_gltf" }
bevy_ext_world = { version = "0.1.0", path = "crates/bevy_ext_world" }
bevy_ext_save = { version = "0.1.0", path = "crates/bevy_ext_save" }
bevy_ext_terrain = { version = "0.1.0", path = "crates/bevy_ext_terrain" }
bevy_voxel_terrain = { version = "0.1.0", path = "crates/bevy_voxel_terrain" }
bevy_ext_audio = { version = "0.1.0", path = "crates/bevy_ext_audio" }
bevy_ext_nav = { version = "0.1.0", path = "crates/bevy_ext_nav" }
bevy_ext_ai = { version = "0.1.0", path = "crates/bevy_ext_ai" }
bevy_ext_water = { version = "0.1.0", path = "crates/bevy_ext_water" }
bevy_ext_grass = { version = "0.1.0", path = "crates/bevy_ext_grass" }
bevy_ext_ui = { version = "0.1.0", path = "crates/bevy_ext_ui" }
bevy_ext_postfx = { version = "0.1.0", path = "crates/bevy_ext_postfx" }
bevy_ext_terrain_runtime = { version = "0.1.0", path = "crates/bevy_ext_terrain_runtime" }
bevy_ext_elements = { version = "0.1.0", path = "crates/bevy_ext_elements" }
bevy_ext_flora = { version = "0.1.0", path = "crates/bevy_ext_flora" }
bevy_ext_gradmesh = { version = "0.1.0", path = "crates/bevy_ext_gradmesh" }
bevy_ext_scene = { version = "0.1.0", path = "crates/bevy_ext_scene" }
bevy_ext_physics = { version = "0.1.0", path = "crates/bevy_ext_physics" }
bevy_ext_engine = { version = "0.1.0", path = "crates/bevy_ext_engine" }
bevy_rapier3d = "0.37"
# O jogo e os crates vivos usam Avian; os crates extraídos ainda por portar
# mantêm o Rapier nas suas próprias linhas.
avian3d = "0.8"
bevy_rerecast = { version = "0.6", default-features = false, features = ["bevy_mesh"] }
bevy_landmass = "0.13"
landmass_rerecast = "0.4"

# Jackdaw 0.20 line: the editor extension pins the same version as the Vael
# editor so type paths and `.bsn` defaults agree.
jackdaw_api = "=0.20.2"
jackdaw_editor_core = { version = "=0.20.2", default-features = false }
jackdaw_feathers = "=0.20.2"
jackdaw_panels = "=0.20.2"
jackdaw_scene_types = { version = "=0.20.2", default-features = false }
lucide-icons = "0.563.0"
meshopt = "0.7"
bevy_kira_audio = { version = "0.27.1", features = ["ogg"] }
tempfile = "3"
naga = { version = "30.0.1", features = ["wgsl-in"] }
wesl = "0.6.0"

anyhow = "1"
jackdaw_bsn = "=0.20.2"
jackdaw_prefab = "=0.20.2"
roxmltree = "0.21"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dirs = "7"
transvoxel = "2"

# Backend de áudio do Viber (kira); o Vael e a engine partilham a mesma linha.
