[workspace]
# Pacotes da release 0.1.0. O plugin `bevy_voxel_terrain_jackdaw` é WIP
# concorrente (API do Jackdaw ainda a fechar) e fica fora do workspace até
# compilar; os ficheiros ficam preservados no repo.
members = [
    "crates/bevy_ext_core",
    "crates/bevy_ext_luau",
    "crates/bevy_ext_gltf",
    "crates/bevy_ext_save",
    "crates/bevy_ext_terrain",
    "crates/bevy_ext_world",
    "crates/bevy_voxel_terrain",
    # Hub do runtime de cena (extração do monólito `viber`): depende do
    # checkout `../Viber` em path durante a transição (TODO(viber-exit)) e
    # NÃO é publicável enquanto isso durar.
    "crates/bevy_ext_scene_runtime",
]
exclude = ["crates/bevy_voxel_terrain_jackdaw"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/bevy_extensions"
authors = ["Maikeu Locatelli"]

[workspace.dependencies]
# Base sem features; cada crate liga o que precisa.
bevy = { version = "0.20.1", default-features = false }

# Família lockstep + path local (o path é removido no `.crate` publicado).
# TRANSITÓRIO (TODO(viber-exit)): estes seis divergem da família (0.1.1)
# porque o monólito `viber` ainda os dep do checkout irmão à 0.1.0
# (direto ou pela feature `terrain` do `bevy_ext_world`) — (nome, versão)
# iguais de paths diferentes colidem no lockfile. Reverter para 0.1.0
# quando o `viber` apontar para os members deste workspace.
bevy_ext_core = { version = "0.1.1", path = "crates/bevy_ext_core" }
bevy_ext_luau = { version = "0.1.0", path = "crates/bevy_ext_luau" }
bevy_ext_gltf = { version = "0.1.1", path = "crates/bevy_ext_gltf" }
bevy_ext_world = { version = "0.1.1", path = "crates/bevy_ext_world" }
bevy_ext_save = { version = "0.1.1", path = "crates/bevy_ext_save" }
bevy_ext_terrain = { version = "0.1.1", path = "crates/bevy_ext_terrain" }
bevy_voxel_terrain = { version = "0.1.1", path = "crates/bevy_voxel_terrain" }
# Transitório: usa o `viber` monólita e as cópias do checkout principal em
# path próprio (ver crates/bevy_ext_scene_runtime/Cargo.toml); entra no
# `{ workspace = true }` só quando essa dependência morrer.
bevy_ext_scene_runtime = { version = "0.1.0", path = "crates/bevy_ext_scene_runtime" }

# Jackdaw 0.20 line: the editor extension pins the same version as the Vael
# editor so type paths and `.bsn` defaults agree.
jackdaw_api = "=0.20.2"
jackdaw_editor_core = { version = "=0.20.2", default-features = false }
jackdaw_feathers = "=0.20.2"
jackdaw_panels = "=0.20.2"
jackdaw_scene_types = { version = "=0.20.2", default-features = false }
lucide-icons = "0.563.0"

anyhow = "1"
jackdaw_bsn = "=0.20.2"
roxmltree = "0.21"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dirs = "7"
tempfile = "3"
meshopt = "0.7"
transvoxel = "2"
