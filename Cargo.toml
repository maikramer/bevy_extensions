[workspace]
# Pacotes da release 0.1.0. As extensões oficiais do Jackdaw vivem em
# `extensions/` como projetos standalone (`jd build`/`.jdext`), fora deste
# workspace.
members = [
    "crates/bevy_ext_core",
    "crates/bevy_ext_ui",
    "crates/bevy_ext_elements",
    "crates/bevy_ext_flora",
    "crates/bevy_ext_gradmesh",
    "crates/bevy_ext_postfx",
    "crates/bevy_ext_scene",
    "crates/bevy_ext_luau",
    "crates/bevy_ext_gltf",
    "crates/bevy_ext_save",
    "crates/bevy_ext_terrain",
    "crates/bevy_ext_world",
    "crates/bevy_voxel_terrain",
]
exclude = [
    "crates/bevy_ext_viber_engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/bevy_extensions"
authors = ["Maikeu Locatelli"]

[workspace.dependencies]
# Base sem features; cada crate liga o que precisa.
bevy = { version = "0.20.1", default-features = false }

# Família lockstep + path local (o path é removido no `.crate` publicado).
bevy_ext_core = { version = "0.1.0", path = "crates/bevy_ext_core" }
bevy_ext_ui = { version = "0.1.0", path = "crates/bevy_ext_ui" }
bevy_ext_gltf = { version = "0.1.0", path = "crates/bevy_ext_gltf" }
bevy_ext_world = { version = "0.1.0", path = "crates/bevy_ext_world" }
bevy_ext_elements = { version = "0.1.0", path = "crates/bevy_ext_elements" }
bevy_ext_flora = { version = "0.1.0", path = "crates/bevy_ext_flora" }
bevy_ext_gradmesh = { version = "0.1.0", path = "crates/bevy_ext_gradmesh" }
bevy_ext_scene = { version = "0.1.0", path = "crates/bevy_ext_scene" }
bevy_ext_luau = { version = "0.1.0", path = "crates/bevy_ext_luau" }
bevy_ext_postfx = { version = "0.1.0", path = "crates/bevy_ext_postfx" }
bevy_ext_save = { version = "0.1.0", path = "crates/bevy_ext_save" }
bevy_ext_terrain = { version = "0.1.0", path = "crates/bevy_ext_terrain" }
bevy_voxel_terrain = { version = "0.1.0", path = "crates/bevy_voxel_terrain" }

anyhow = "1"
jackdaw_bsn = "=0.20.2"
jackdaw_prefab = "=0.20.2"
roxmltree = "0.21"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dirs = "7"
tempfile = "3"
meshopt = "0.7"
transvoxel = "2"
