[package]
name = "bevy_ext_physics"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Rapier physics for the Viber world contract: declarative colliders, deferred mesh shapes, voxel terrain streaming, knockback/fall FX and short ragdolls"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/bevy_extensions"
authors = ["Maikeu Locatelli"]
readme = "README.md"
keywords = ["bevy", "physics", "rapier", "colliders", "voxel"]
categories = ["game-development"]

# Workspace PRÓPRIO (vazio): o crate está EXCLUÍDO do workspace da raiz
# (padrão do `bevy_ext_engine`/`bevy_ext_scene_runtime` enquanto o monólito
# ainda depender dele por fora). As deps da família usam os MESMOS caminhos
# `../…` que o monólito, para os tipos casarem. Quando o monólito trocar
# para os members da raiz, mover este crate para os members e trocar os
# paths por `{ workspace = true }`.
[workspace]

[features]
# Apps de teste headless (sem `GizmoConfigStore`): o debug render do rapier,
# mesmo desligado, panica à procura do store — não registar o plugin.
headless = []

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "bevy_animation",
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
] }
# Mesmas linha de features do `viber`: dim3 + debug-render (o toggle F3
# dos colisores usa o `RapierDebugRenderPlugin`).
bevy_rapier3d = { version = "0.37", default-features = false, features = [
    "dim3",
    "async-collider",
    "debug-render-3d",
] }
bevy_ext_core = { version = "0.1.0", path = "../bevy_ext_core" }
# `Shape`/`bounds` das primitivas (`collider_for_shape`): o MESMO path que o
# monólito usa, para os tipos coincidirem.
bevy_ext_scene = { version = "0.1.0", path = "../bevy_ext_scene" }
# Terreno volumétrico extraído: o streaming de colisores voxel lê
# `TerrainSpec`/`TerrainChunk`/`ChunkMeshData`/`TerrainSet` do crate.
bevy_ext_terrain_runtime = { version = "0.1.0", path = "../bevy_ext_terrain_runtime" }
[dev-dependencies]
# (nenhuma por agora; os testes usam MinimalPlugins do próprio bevy)
