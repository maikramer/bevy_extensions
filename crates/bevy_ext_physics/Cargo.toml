[package]
name = "bevy_ext_physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rapier physics for the Viber world contract: declarative colliders, deferred mesh shapes, voxel terrain streaming, knockback/fall FX and short ragdolls"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "physics", "rapier", "colliders", "voxel"]
categories = ["game-development"]

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "bevy_animation",
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
] }
bevy_rapier3d.workspace = true
bevy_ext_core = { workspace = true }
# TODO(viber-exit): interop transitória com o monólito enquanto o terrain
# runtime (`TerrainRuntime`/`TerrainChunk`/`VoxelChunk`/`ChunkMeshData`),
# o sampler do herói (`ground_near`) e os tipos de animação/morte
# (`CharacterAnimator`, `Corpse`) não saem para crates próprios. O caminho
# aponta para um snapshot local do checkout irmão (`viber-wt/Viber`,
# fora do git) com symlinks `bevy_extensions`/`CelerAI` para os irmãos —
# no merge, trocar por `path = "../../../Viber"`.
viber = { path = "../../viber-wt/Viber" }

[dev-dependencies]
# (nenhuma por agora; os testes usam MinimalPlugins do próprio bevy)
