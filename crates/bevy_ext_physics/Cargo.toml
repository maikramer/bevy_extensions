[package]
name = "bevy_ext_physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Avian physics for the Viber world contract: declarative colliders, deferred mesh shapes, voxel terrain streaming, knockback/fall FX, ragdolls, corpse marker and foot/head IK"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "physics", "avian", "colliders", "voxel"]
categories = ["game-development"]

[features]
# Apps de teste headless (sem `GizmoConfigStore`): o debug render do avian,
# mesmo desligado, espera o store dos gizmos — não registar o plugin. O
# dev-dep do monólito liga esta feature nos testes dele.
headless = []

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "bevy_animation",
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
] }
# Fork vendored do upstream `jmwmulle/bevy_skeleton_modifiers` 0.1.1 (port
# Bevy 0.20/glam 0.33; proveniência e diffs em
# `../../vendor/bevy_skeleton_modifiers/VAEL_PATCH.md`).
# Substitui o solver 2-bone próprio do `ik.rs` na Fase 1 da migração do IK.
bevy_skeleton_modifiers = { path = "../../vendor/bevy_skeleton_modifiers" }
# Mesma linha do `viber`/monólito (0.8, bevy 0.20): defaults trazem o backend
# parry-f32, os joints e o debug render (o toggle F3 dos colisores usa o
# `PhysicsDebugPlugin` + `PhysicsGizmos`); a feature fica explícita para o
# `-p` isolado.
avian3d = { workspace = true, features = ["debug-plugin", "bevy_diagnostic"] }
bevy_ext_core = { workspace = true }
# IR das receitas (`Shape`/`TransformSpec`/`parse_component_string`).
bevy_ext_scene = { workspace = true }
# Runtime de terreno: streaming de colliders voxel lê `TerrainRuntime`,
# `TerrainChunk`, `VoxelChunk`, `TerrainSet` e o `ChunkMeshData` do mesher.
bevy_ext_terrain_runtime = { workspace = true }

[dev-dependencies]
# (nenhuma por agora; os testes usam MinimalPlugins do próprio bevy)
