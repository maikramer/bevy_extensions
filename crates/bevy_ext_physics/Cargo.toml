[package]
name = "bevy_ext_physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rapier physics for the Viber world contract: declarative colliders, deferred mesh shapes, voxel terrain streaming, knockback/fall FX, ragdolls, corpse marker and foot/head IK"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "physics", "rapier", "colliders", "voxel"]
categories = ["game-development"]

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "bevy_animation",
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
] }
bevy_rapier3d.workspace = true
bevy_ext_core = { workspace = true }
# IR das receitas (`Shape`/`TransformSpec`/`parse_component_string`).
bevy_ext_scene = { workspace = true }
# Runtime de terreno: streaming de colliders voxel lê `TerrainRuntime`,
# `TerrainChunk`, `VoxelChunk`, `TerrainSet` e o `ChunkMeshData` do mesher.
bevy_ext_terrain_runtime = { workspace = true }

[dev-dependencies]
# (nenhuma por agora; os testes usam MinimalPlugins do próprio bevy)
