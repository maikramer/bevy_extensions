[package]
name = "bevy_ext_luau"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Host de scripting do Vael sobre bevy_mod_scripting (Luau) com a tabela viber"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["bevy", "scripting", "luau", "gamedev"]
categories = ["game-development"]

[dependencies]
bevy = { workspace = true, features = ["std"] }
bevy_ext_core = { workspace = true }
bevy_ext_ui = { workspace = true, optional = true }
bevy_mod_scripting = { version = "0.24", features = ["luau"] }
# Os `ScriptContexts` do BMS guardam o `LuaContext` num `parking_lot::Mutex`;
# os mapas de subscritores/timers nomeiam esse `Arc`, por isso o tipo tem de
# ser o MESMO (um `std::sync::Mutex` não unifica e o `Arc::downgrade` falha).
parking_lot = "0.12"
log = "0.4"
mlua = { version = "0.12", features = ["luau", "vendored", "send"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# F8 (exit4): runtimes IA do CelerAI — as MESMAS path-deps que o monólito
# tinha; features `nlu`/`decision` OFF por defeito (sem CelerAI ao lado, os
# `viber.nlu`/`viber.decision` devolvem available()=false e o jogo segue no
# fluxo antigo).
celer-nlu = { version = "0.3.0", path = "../../../CelerAI/crates/nlu", optional = true }
celer-decision = { version = "0.1.0", path = "../../../CelerAI/crates/decision", optional = true }

[features]
# Seam sobre o `bevy_ext_ui` (F2): instala `viber.ui` (a superficie Luau da
# UI declarativa) em cada contexto criado pelo VaelScriptingPlugin. O crate
# ui NAO pode dep do luau (ciclo), portanto o luau e que o dep e captura o
# `UiScriptState` no build do plugin. Default OFF — consumers sem UI nao
# pagam o `bevy_ext_world` que a UI arrasta.
ui = ["dep:bevy_ext_ui"]
nlu = ["dep:celer-nlu"]
decision = ["dep:celer-decision"]
# O conjunto de jogo: tudo o que o Vael liga.
