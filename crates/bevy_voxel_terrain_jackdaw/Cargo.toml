[package]
name = "bevy_voxel_terrain_jackdaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Jackdaw editor extension for bevy_voxel_terrain: VoxelTerrain panel and viewport preview"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# Editor-only: depends on the Jackdaw editor crates. The scene components it
# edits live in `bevy_ext_terrain` and stay usable by the game without an
# editor dependency.
publish = false

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_text",
    "bevy_ui",
] }
bevy_ext_terrain.workspace = true
bevy_voxel_terrain.workspace = true
jackdaw_api.workspace = true
jackdaw_editor_core.workspace = true
jackdaw_feathers.workspace = true
jackdaw_scene_types.workspace = true
lucide-icons.workspace = true
