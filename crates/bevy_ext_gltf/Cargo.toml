# TRANSITÓRIO (TODO(viber-exit)): versão divergida da família (0.1.0) porque o
# monólito `viber` ainda dep esta família do checkout irmão
# `../bevy_extensions` à 0.1.0 — dois pacotes path com o mesmo (nome,
# versão) colidem no lockfile do workspace. Voltar a
# `version.workspace = true` quando o `viber` apontar para os members
# deste workspace.
[package]
name = "bevy_ext_gltf"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "GLB decoder for Bevy with EXT_meshopt_compression, KHR_mesh_quantization and KHR_texture_basisu"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "gltf", "meshopt", "ktx2", "compression"]
categories = ["game-development", "rendering"]

[features]
# `bounds` e `textures` são utilitários opcionais; o decoder é sempre incluído.
default = ["bounds", "textures"]
bounds = []
textures = []

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "bevy_asset",
    "bevy_gltf",
    "bevy_image",
    "bevy_log",
    "bevy_render",
] }
meshopt.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
