[package]
name = "bevy_ext_gltf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GLB decoder for Bevy with EXT_meshopt_compression, KHR_mesh_quantization and KHR_texture_basisu"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "gltf", "meshopt", "ktx2", "compression"]
categories = ["game-development", "rendering"]

[features]
# `bounds` e `textures` são utilitários opcionais; o decoder é sempre incluído.
default = ["bounds", "textures"]
bounds = []
textures = []
# O decoder anterior à passagem única, guardado como oráculo byte-a-byte para o
# teste de paridade e para o A/B do `decode_bench`. Nenhuma app o liga.
legacy = []

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "bevy_asset",
    "bevy_gltf",
    "bevy_image",
    "bevy_log",
    "bevy_render",
] }
meshopt.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
