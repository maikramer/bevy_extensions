# TRANSITÓRIO (TODO(viber-exit)): versão divergida da família (0.1.0) porque o
# monólito `viber` ainda dep esta família do checkout irmão
# `../bevy_extensions` à 0.1.0 — dois pacotes path com o mesmo (nome,
# versão) colidem no lockfile do workspace. Voltar a
# `version.workspace = true` quando o `viber` apontar para os members
# deste workspace.
[package]
name = "bevy_ext_save"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Save envelope, slots and atomic JSON I/O for Bevy games"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "save", "slots", "persistence"]
categories = ["game-development"]

[dependencies]
bevy = { workspace = true, features = ["std"] }
bevy_ext_world = { workspace = true }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
