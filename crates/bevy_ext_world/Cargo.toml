# TRANSITÓRIO (TODO(viber-exit)): versão divergida da família (0.1.0) porque o
# monólito `viber` ainda dep esta família do checkout irmão
# `../bevy_extensions` à 0.1.0 — dois pacotes path com o mesmo (nome,
# versão) colidem no lockfile do workspace. Voltar a
# `version.workspace = true` quando o `viber` apontar para os members
# deste workspace.
[package]
name = "bevy_ext_world"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Declarative world formats for Bevy: XML, BSN and the .vinst binary"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "xml", "world", "gamedev"]
categories = ["game-development", "parser-implementations"]

[features]
# Ponte dos componentes `bevy_ext_terrain::voxel.*` para a vista DSL no loader.
# Desligada por defeito: a ordem de publish core→world→… fica intacta.
terrain = ["dep:bevy_ext_terrain"]

[dependencies]
# Only ECS/reflect/math: the parser and the binary format are independent of
# the renderer and the runtime. `bevy_ecs`/`bevy_reflect` are needed by the
# `bsn` bridge components (`WorldNode`).
bevy = { workspace = true, features = ["std", "bevy_camera", "bevy_log"] }
# Formato `.bsn` (Jackdaw): o jogo lê o documento e reconstrói `XmlNode`; não
# puxa `jackdaw_runtime` nem o editor.
jackdaw_bsn.workspace = true
jackdaw_scene_types.workspace = true
# `IsA` (prefab do Jackdaw): os `<Include>` são instâncias que o editor
# expande; o loader resolve-as com o mesmo código.
jackdaw_prefab.workspace = true
# Componentes tipados (colisor, corpo, destrutível, colheita) ↔ atributos.
bevy_ext_scene.workspace = true
# Componentes do terreno (caves/arcos/pontes) ↔ nós DSL, opt-in.
bevy_ext_terrain = { workspace = true, optional = true }
anyhow.workspace = true
roxmltree.workspace = true
flate2.workspace = true
serde.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
tempfile.workspace = true
