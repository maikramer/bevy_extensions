# TRANSITÓRIO (TODO(viber-exit)): versão divergida da família (0.1.0) porque o
# monólito `viber` ainda dep esta família do checkout irmão
# `../bevy_extensions` à 0.1.0 (direto e pela feature `terrain` do
# `bevy_ext_world`) — dois pacotes path com o mesmo (nome, versão)
# colidem no lockfile do workspace. Voltar a `version.workspace = true`
# quando o `viber` apontar para os members deste workspace.
[package]
name = "bevy_ext_terrain"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Voxel terrain scene components for Bevy: VoxelTerrain, caves, arches and bridges"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "terrain", "voxel", "sdf", "level"]
categories = ["game-development", "rendering"]

[dependencies]
# ECS/reflect/math only: this crate is the scene contract shared by the game
# and the editor. It must not pull a renderer or the Jackdaw editor.
bevy = { workspace = true, features = ["std"] }
bevy_voxel_terrain = { workspace = true }
anyhow.workspace = true
flate2.workspace = true
serde_json.workspace = true
