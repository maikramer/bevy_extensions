[package]
name = "bevy_ext_scene_runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Scene runtime for declarative Viber worlds: scene loader, world spawner, spawn gates and streaming rings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/bevy_extensions"
authors = ["Maikeu Locatelli"]
keywords = ["bevy", "scenes", "gamedev", "portals", "streaming"]
categories = ["game-development"]

# Workspace PRÓPRIO (vazio), de propósito: este crate fica EXCLUÍDO do
# workspace irmão (`../Cargo.toml` da raiz) enquanto depender do monólito em
# path — mantém o grafo da raiz leve e os paths da família `../…` uniformes
# (padrão do `bevy_ext_engine`). Quando a dep do `viber` morrer: mover para
# os members da raiz, trocar os paths por `{ workspace = true }` e apagar
# esta tabela.
[workspace]

[dependencies]
# ECS/reflect/math + os subsistemas que o runtime de cena toca (UI do fade,
# GLTF pendente, cenas, luzes, meshes). A união de features com o resto do
# grafo (o `viber` transitório liga o set completo) garante uma só build.
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_scene",
    "bevy_world_serialization",
    "bevy_gltf",
    "bevy_animation",
    "bevy_render",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_ui",
    "bevy_picking",
] }
# Contrato de primitivas (`Shape`/`MaterialSpec`/`PrimitivePart`), já
# extraído. O path tem de ser O MESMO que o do monólito (`viber` usa
# `../bevy_ext_scene`): senão o cargo compila duas cópias do pacote e os
# tipos deixam de casar com os da engine.
bevy_ext_scene = { version = "0.1.0", path = "../bevy_ext_scene" }
# Física (o spawn monta corpos/colisores Rapier; o gate congela até haver chão).
bevy_rapier3d = { version = "0.37", default-features = false, features = [
    "dim3",
    "async-collider",
    "debug-render-3d",
] }
# Callbacks `on_spawned` do spawn de protótipos por script (mlua::Function).
mlua = { version = "0.12", features = ["luau", "vendored", "send"] }
# O varrimento de cena pára os loops kira das entidades condenadas.
bevy_kira_audio = { version = "0.27.1", features = ["ogg", "spatial"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
# `config.yaml` (serde_yaml) + `~` do save.dir (dirs).
serde_yaml = "0.9"
dirs = "7"

# Contratos de partilha já extraídos, consumidos DIRECTAMENTE (a ponte ao
# `viber` só mantém o que ainda não saiu). Os paths têm de ser OS MESMOS que
# os que o monólito usa (`../…` a partir de `crates/`): `Player`, `SfxEvent`,
# `Knockback`, `MenusOpen` são re-exports `viber::*` → core, e um segundo
# path para o mesmo (nome, versão) colide no lockfile e cria tipos
# duplicados.
bevy_engine_core = { package = "bevy_ext_core", version = "0.1.0", path = "../bevy_ext_core" }
bevy_world_xml = { package = "bevy_ext_world", version = "0.1.0", path = "../bevy_ext_world" }
# Música/BGM (loops kira, `MusicLayerTag`, overrides por cena).
bevy_ext_audio = { version = "0.1.0", path = "../bevy_ext_audio" }
# Navmesh (`reset_for_scene` no fim da troca de cena).
bevy_ext_nav = { version = "0.1.0", path = "../bevy_ext_nav" }
# Terreno volumétrico (specs das features, runtime, plugin/delta — reset por cena).
bevy_ext_terrain_runtime = { version = "0.1.0", path = "../bevy_ext_terrain_runtime" }
# Física declarativa (colisores, `PendingCollider`, `VoxelCollider`).
bevy_ext_physics = { version = "0.1.0", path = "../bevy_ext_physics" }
# Decoder GLB meshopt/KTX2 (`load_gltf` + ladder implícita de LODs).
bevy_ext_gltf = { version = "0.1.0", path = "../bevy_ext_gltf" }

# Câmara de jogo — o contrato `OrbitCamera`/`DEFAULT_ORBIT_PIVOT_HEIGHT`
# (onda exit2/hubs, TypePath `viber::recipes::spawn` congelado lá): o spawn
# e as cópias de câmara/player deste crate partilham UM tipo com o jogo.
bevy_ext_engine = { version = "0.1.0", path = "../bevy_ext_engine" }

# Primitivas procedurais de qualidade (grad de material por spec, cache de
# meshes/materials por chave) — o mesmo pipeline do spawner do monólito
# (exit3/wave-c: a cópia do spawn.rs voltou a ter o pipeline; sem o dep o
# spawner cairia no StandardMaterial e o jogo perdia os materiais).
bevy_gradmesh = "0.3.9"

# TODO(viber-exit): dependência TRANSITÓRIA ao monólito (a cópia
# `bevy_ext_viber_engine`, com o lib name histórico `viber`) — o hub do
# runtime de cena ainda consome da engine o parser do mundo
# (`recipes::parse_world`), o spawner de grupos, o host Luau, a UI/HUD, o
# céu, as cinemáticas, o ragdoll e os módulos de editor (`scene`, …). A
# lista em `src/lib.rs` diz o que falta; apagar a linha quando esse pedaço
# sair do `viber` para um crate próprio.
viber = { package = "bevy_ext_viber_engine", path = "../bevy_ext_viber_engine" }

[features]
default = ["experimental_pbr_pcss"]
# PCSS (soft shadows físicos): `soft_shadows_enabled`/`soft_shadow_size` no
# spawn das luzes. Re-export da feature do bevy, como no `viber`.
experimental_pbr_pcss = ["bevy/experimental_pbr_pcss"]

[dev-dependencies]
tempfile = "3"
