# TRANSITÓRIO (TODO(viber-exit)): versão divergida da família (0.1.0) porque o
# monólito `viber` ainda dep esta família do checkout irmão
# `../bevy_extensions` à 0.1.0 — dois pacotes path com o mesmo (nome,
# versão) colidem no lockfile do workspace. Voltar a
# `version.workspace = true` quando o `viber` apontar para os members
# deste workspace.
[package]
name = "bevy_ext_core"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Shared contracts for Bevy extension packages: markers, schedule sets and deterministic RNG"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bevy", "gamedev", "engine", "contracts"]
categories = ["game-development"]

[dependencies]
# ECS/reflect/math + a camada de animação (contrato `CharacterAnimator`/
# `FrozenAnimation`: `AnimationNodeIndex`/`AnimationGraphHandle` do glTF).
# `std` traz o `bevy_input` (teclado/gamepad do contrato `input_map`).
# `bevy_camera`: o contrato `camera::is_window_camera` lê `Camera`/
# `RenderTarget` — antes só compilava com a unificação de features dos
# consumers com UI (o check standalone do crate falhava).
bevy = { workspace = true, features = ["std", "bevy_animation", "bevy_camera"] }
# `A11y`/`Action`/`Binding`/`ActionMap`/`ActionState` viajam nos saves e
# opções (serialize/deserialize).
serde = { workspace = true }
# `Locale::load` lê `locale/<lang>.json` (mapa chave → string).
serde_json = { workspace = true }
