[package]
name = "bevy_ext_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Grab-bag transitório de sistemas pequenos da engine Viber (netplay, cinemáticas, folhagem, relva, céu, vitais, pacing, drivers do mundo); será dividido depois"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/bevy_extensions"
authors = ["Maikeu Locatelli"]
keywords = ["bevy", "gamedev", "engine"]
categories = ["game-development"]
# Workspace PRÓPRIO (vazio), de propósito: este crate está EXCLUÍDO do
# workspace irmão (`../Cargo.toml` da raiz) enquanto depender do monólito
# `viber` em path — o `viber` aponta a família `bevy_ext_*` para o checkout
# irmão (`../bevy_extensions`) e membro + viber colidem no lockfile (duas
# fontes com o mesmo name+version). As deps da família em baixo usam OS
# MESMOS caminhos que o `viber` (padrão do `bevy_ext_scene_runtime`,
# exit/scene), por isso os tipos são idênticos aos da engine. Quando a dep do
# `viber` morrer: mover para os members da raiz, trocar os paths por
# `{ workspace = true }` e apagar esta tabela.
[workspace]

[features]
default = []
# DLSS Super Resolution (NVIDIA NGX): NÃO-default de propósito — o
# `dlss_wgpu` precisa do SDK da NVIDIA em compile-time (`DLSS_SDK`, ver
# src/dlss.rs). Sem a feature o módulo reduz-se ao parser (testável em CI).
dlss = ["bevy/dlss"]

[dependencies]
# O grab-bag toca no ECS, no render (pbr/pós-processo/TAA), na UI e na
# janela: os plugins registam sistemas em Update/PostUpdate/Last/Core3d.
# Mesma linha da raiz (`bevy = { version = "0.20.1", default-features = false }`).
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_anti_alias",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_picking",
    "bevy_post_process",
    "bevy_render",
    "bevy_scene",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    # `WorldAssetRoot` (folhagem) e as luzes (drivers do mundo, céu).
    "bevy_world_serialization",
    "bevy_light",
] }
serde_json = "1"
# Colisores/rigídios no gate do batch de folhagem (`foliage.rs`); mesma
# linha do `viber` para os tipos coincidirem com os da engine.
bevy_rapier3d = { version = "0.37", default-features = false, features = [
    "dim3",
] }
# TODO(viber-exit): TRANSITÓRIO — os três caminhos em baixo têm de ser OS
# MESMOS que os que o `viber` usa (checkout irmão `../bevy_extensions`),
# senão o cargo compila duas cópias do pacote e os tipos deixam de casar com
# os da engine (`Player` do `netplay`/`vitals` deixaria de ser o `Player` do
# monólito). Quando o `viber` trocar para os members do workspace, trocar
# aqui pelos paths da raiz.
bevy_ext_core = { version = "0.1.0", path = "../../../bevy_extensions/crates/bevy_ext_core" }
bevy_ext_gltf = { version = "0.1.0", path = "../../../bevy_extensions/crates/bevy_ext_gltf" }
bevy_ext_world = { version = "0.1.0", path = "../../../bevy_extensions/crates/bevy_ext_world" }
# TODO(viber-exit): dependência TRANSITÓRIA ao monólito. Os módulos deste
# crate ainda leem da engine o que ainda não saiu de lá: `input_map`,
# `profiler` (Group/timed), `terrain` (runtime/cliffs/water/plugin),
# `camera::camera_offset`, `luau` (fila de eventos/gate de SFX/LuaScriptRef),
# `animation`, `physics`, `spawner` (exclusões), `ambient`
# (point_in_polygon), `hud::assets`, `ibl`, `app::RunMode`, `menus`,
# `render_lod`, `scene::pose`, `scene_loader`, `recipes` (specs/spawn),
# `config` (ReflectionsConfig), `sky_nishita` e `worldsys` (biomas). Cada uso
# está marcado com `// TODO(viber-exit)`; quando o módulo de origem sair,
# trocar pelo crate novo e apagar esta dep.
viber = { path = "../../../Viber" }
