[package]
name = "bevy_ext_engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Grab-bag de sistemas pequenos da engine Viber (cinemáticas, folhagem, relva, céu, water SSR, pacing, drivers do mundo, profiler); será dividido depois"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["bevy", "gamedev", "engine"]
categories = ["game-development"]

[features]
default = []
# DLSS Super Resolution (NVIDIA NGX): NÃO-default de propósito — o
# `dlss_wgpu` precisa do SDK da NVIDIA em compile-time (`DLSS_SDK`, ver
# src/dlss.rs). Sem a feature o módulo reduz-se ao parser (testável em CI).
dlss = ["bevy/dlss"]
# O método `ScriptGameEvent::to_table` (evento → tabela Lua) precisa do
# runtime mlua; o monólito liga esta feature, os consumidores sem host Luau
# empilham/lêem eventos sem a tabela.
luau = ["dep:mlua"]

[dependencies]
# O grab-bag toca no ECS, no render (pbr/pós-processo/TAA), na UI e na
# janela: os plugins registam sistemas em Update/PostUpdate/Last/Core3d.
bevy = { workspace = true, features = [
    "std",
    "bevy_asset",
    "bevy_anti_alias",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_picking",
    "bevy_post_process",
    "bevy_render",
    "bevy_scene",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    # `WorldAssetRoot` (folhagem) e as luzes (drivers do mundo, céu).
    "bevy_world_serialization",
    "bevy_light",
] }
serde = { workspace = true }
serde_json = { workspace = true }
# Simplificação de malhas na ladder de LOD (`render_lod`).
meshopt = { workspace = true }
# Colisores/rigídios no gate do batch de folhagem (`foliage.rs`).
bevy_rapier3d = { workspace = true }
# Contratos: `Player`, `SfxClip`, `CharacterAnimator` (anim. congelada), RNG.
bevy_ext_core = { workspace = true }
bevy_ext_gltf = { workspace = true }
bevy_ext_world = { workspace = true }
# Colisores pendentes/especs de física no gate da folhagem e nos testes do céu.
bevy_ext_physics = { workspace = true }
# Runtime de terreno: `TerrainRuntime`, `ChunkLodState`, cliffs/water/sets.
bevy_ext_terrain_runtime = { workspace = true }
# Biomas (`BiomeRegions`/`BiomeRegionData` com TypePath `viber::worldsys`
# congelado lá) e `point_in_polygon`.
bevy_ext_postfx = { workspace = true }
# Runtime mlua — só para `ScriptGameEvent::to_table` (feature `luau`).
mlua = { version = "0.12", features = ["luau", "vendored", "send"], optional = true }

[dev-dependencies]
# Export de trace para ficheiro nos testes do gravador.
tempfile = { workspace = true }
