[package]
name = "vael_jackdaw"
version = "0.1.9"
edition = "2024"
rust-version = "1.97.1"
description = "Jackdaw editor extension for Vael: environment (bevy_elements), post-processing and flora (bevy_flora) panels with viewport previews"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/bevy_extensions"
authors = ["Maikeu Locatelli"]
publish = false

# Extensão oficial do Jackdaw: projeto standalone; `jd build` gera o shim em
# `.jackdaw/` e compila contra o SDK do editor.
[workspace]

[package.metadata.jackdaw]
label = "Vael: Ambiente, PostFX e Flora"

[dependencies]
# `jd` redireciona estes para o dylib partilhado do SDK do editor.
bevy = "0.20"
jackdaw_extension = "0.20"
jackdaw_api = "0.20"

# Contratos de cena (runtime-safe), os mesmos que o jogo lê.
bevy_ext_elements = { path = "../../crates/bevy_ext_elements" }
bevy_ext_flora = { path = "../../crates/bevy_ext_flora" }
bevy_ext_postfx = { path = "../../crates/bevy_ext_postfx" }
# Árvores reais no viewport (Bevy puro).
bevy_flora = "0.47"
# Primitivas procedurais do mundo: a MESMA conversão do jogo (shape, preset,
# gradiente por vértices), para o viewport não mentir sobre o look final.
bevy_ext_gradmesh = { path = "../../crates/bevy_ext_gradmesh" }
bevy_gradmesh = "=0.3.9"
